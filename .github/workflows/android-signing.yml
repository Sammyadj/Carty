name: Android signing checks

on:
  pull_request:
    paths:
      - 'android/**'
      - 'pubspec.*'
      - 'tool/verify_android_signing.py'
      - '.github/workflows/android-signing.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'pubspec.*'
      - 'tool/verify_android_signing.py'
      - '.github/workflows/android-signing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Build Debug and initialise local Gradle wrapper
        run: flutter build apk --debug
      - name: Verify signing failures and a disposable signed Release APK
        shell: bash
        run: |
          apk_signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apk_signer"
          python3 tool/verify_android_signing.py --gradle android/gradlew --apksigner "$apk_signer"
