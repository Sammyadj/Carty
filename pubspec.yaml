name: carty_app
description: A shopping companion for tracking your basket, budget and reusable lists.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.8'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  # Retain the tested scanner version during SDK migration.
  mobile_scanner: 7.0.0
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Manrope-OFL.txt
    - assets/fonts/DMSans-OFL.txt
    - assets/fonts/NunitoSans-OFL.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
